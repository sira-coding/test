<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My KU My Nature - สำรวจและเรียนรู้ธรรมชาติภายในมหาวิทยาลัยเกษตรศาสตร์">
    <title>My KU My Nature</title>

    <!-- ใส่ Favicon บนแท็บเบราว์เซอร์ -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Dark Mode CSS */
        body.dark-mode .welcome {
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.85)
                ),
                url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e");
        }

        body.dark-mode .start-button {
            background: #2e7d32;
            color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        body.dark-mode .theme-toggle-top {
            background: rgba(30, 38, 32, 0.8);
            border-color: #3e4e40;
            color: #ffeb3b;
        }

        /* Welcome Section */
        .welcome {
            width: 100%;
            height: 100vh;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.55)
                ),
                url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .content {
            padding: 30px;
            animation: fadeIn 1.5s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ปรับสไตล์รูปโลโก้ให้พอดี */
        .site-logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.3));
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .start-button {
            border: none;
            padding: 16px 38px;
            border-radius: 50px;
            background: white;
            color: #2e7d32;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            user-select: none;
        }

        .start-button:hover {
            transform: scale(1.05);
        }

        .theme-toggle-top {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid #ccc;
            border-radius: 50px;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .site-logo { width: 90px; }
            .title { font-size: 30px; }
            .subtitle { font-size: 16px; }
            .start-button { font-size: 16px; padding: 14px 32px; }
        }
    </style>
</head>
<body>

    <section class="welcome">
        <button class="theme-toggle-top" id="themeToggleBtn" onclick="toggleDarkMode()">🌙</button>

        <div class="content">
            <!-- แสดงรูปโลโก้อย่างเดียว โดดเด่น สวยงาม -->
            <img src="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy" alt="KU Nature Logo" class="site-logo">
            
            <h1 class="title">MY KU MY NATURE</h1>
            <p class="subtitle">Discover • Learn • Experience Nature</p>
            
            <button class="start-button" onclick="startExplore()">
                เริ่มสำรวจ 🌱
            </button>
        </div>
    </section>

    <script>
        function startExplore() {
            window.location.href = "./library.html";
        }

        function toggleDarkMode() {
            const body = document.body;
            const btn = document.getElementById("themeToggleBtn");
            body.classList.toggle("dark-mode");
            if (body.classList.contains("dark-mode")) {
                btn.innerHTML = "☀️";
                localStorage.setItem("theme", "dark");
            } else {
                btn.innerHTML = "🌙";
                localStorage.setItem("theme", "light");
            }
        }

        (function checkSavedTheme() {
            const savedTheme = localStorage.getItem("theme");
            const btn = document.getElementById("themeToggleBtn");
            if (savedTheme === "dark") {
                document.body.classList.add("dark-mode");
                if(btn) btn.innerHTML = "☀️";
            }
        })();
    </script>
</body>
</html>
