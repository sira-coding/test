<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - My KU My Nature</title>

    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f8f4; color: #263528; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .login-card { background: white; width: 100%; max-width: 400px; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; border: 1px solid #e0e0e0; }
        .logo-img { height: 60px; width: auto; margin-bottom: 15px; }
        .login-title { font-size: 22px; color: #2e7d32; font-weight: bold; margin-bottom: 5px; }
        .login-subtitle { font-size: 13px; color: #666; margin-bottom: 25px; }

        .form-group { text-align: left; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #2e7d32; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 12px; font-size: 14px; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: #2e7d32; box-shadow: 0 0 0 3px rgba(46,125,50,0.15); }

        .btn-login { width: 100%; background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 15px rgba(46,125,50,0.25); }
        .btn-login:hover { background: #236327; }

        .error-msg { color: #d32f2f; font-size: 13px; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>

<body>

    <div class="login-card">
        <img src="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy" alt="KU Nature Logo" class="logo-img">
        <div class="login-title">MY KU MY NATURE</div>
        <div class="login-subtitle">ลงชื่อเข้าใช้งานระบบคลังข้อมูลธรรมชาติ</div>

        <form onsubmit="handleStrictLogin(event)">
            <div class="form-group">
                <label>ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" id="loginUsername" placeholder="กรอกชื่อผู้ใช้ของคุณ" required autocomplete="username">
            </div>

            <div class="form-group">
                <label>รหัสผ่าน (Password)</label>
                <input type="password" id="loginPassword" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="btnLoginSubmit">เข้าสู่ระบบ ➔</button>
            <div class="error-msg" id="loginErrorMsg">⚠️ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!</div>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOnvU6c3-EouUDoxzxDSTTEI-siU3d0fo",
            authDomain: "mykumynature.firebaseapp.com",
            databaseURL: "https://mykumynature-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "mykumynature",
            storageBucket: "mykumynature.firebasestorage.app",
            messagingSenderId: "871727030249",
            appId: "1:871727030249:web:c0ffea6461c0503765f578",
            measurementId: "G-BE88SS6HLJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function handleStrictLogin(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById("loginUsername").value.trim();
            const passwordInput = document.getElementById("loginPassword").value.trim();
            const errorMsg = document.getElementById("loginErrorMsg");
            const btnSubmit = document.getElementById("btnLoginSubmit");

            errorMsg.style.display = "none";
            btnSubmit.innerText = "⏳ กำลังตรวจสอบข้อมูล...";
            btnSubmit.disabled = true;

            // ตรวจสอบข้อมูลจาก Firebase Database โหนด users/{username}
            db.ref('users/' + usernameInput).once('value', (snapshot) => {
                const userData = snapshot.val();
                
                btnSubmit.innerText = "เข้าสู่ระบบ ➔";
                btnSubmit.disabled = false;

                // 1. ถ้าไม่มีบัญชีนี้ในฐานข้อมูล
                if (!userData) {
                    errorMsg.innerText = "❌ ไม่พบชื่อผู้ใช้นี้ในระบบ กรุณาตรวจสอบอีกครั้ง";
                    errorMsg.style.display = "block";
                    return;
                }

                // 2. ถ้ามีบัญชีแต่รหัสผ่านไม่ตรงกัน
                if (userData.password !== passwordInput) {
                    errorMsg.innerText = "❌ รหัสผ่านไม่ถูกต้อง!";
                    errorMsg.style.display = "block";
                    return;
                }

                // 3. ยืนยันถูกต้อง บันทึก Session และสิทธิ์ (Role) ลง LocalStorage
                const userSession = {
                    username: usernameInput,
                    fullName: userData.fullName || usernameInput,
                    role: userData.role || 'user', // ดึงสิทธิ์ admin/user จาก DB โดยตรง
                    avatar: userData.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${usernameInput}`
                };

                localStorage.setItem("ku_user", JSON.stringify(userSession));
                
                // ย้ายไปยังหน้าคลังธรรมชาติ
                window.location.href = "./library.html";
            }, (error) => {
                btnSubmit.innerText = "เข้าสู่ระบบ ➔";
                btnSubmit.disabled = false;
                errorMsg.innerText = "⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล";
                errorMsg.style.display = "block";
            });
        }

        // ถ้ามีการเข้าสู่ระบบไว้อยู่แล้ว ให้ข้ามไปหน้า library ทันที
        (function checkAlreadyLoggedIn() {
            if (localStorage.getItem("ku_user")) {
                window.location.href = "./library.html";
            }
        })();
    </script>
</body>
</html>
