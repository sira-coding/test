<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แนะนำพืชให้รู้จัก - My KU My Nature</title>

    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f8f4; color: #263528; padding-bottom: 50px; transition: background 0.3s, color 0.3s; }
        body.dark-mode { background: #121813; color: #e0e6e1; }
        body.dark-mode header, body.dark-mode .sidebar { background: #1e2620; border-color: #2e3b30; }
        body.dark-mode .suggest-card { background: #1e2620; color: #e0e6e1; }
        body.dark-mode input, body.dark-mode textarea, body.dark-mode select { background: #2a352c; border-color: #3e4e40; color: #fff; }

        header { background: white; padding: 14px 5%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .hamburger-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: inherit; padding: 5px; }
        .header-logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .header-logo-img { height: 38px; width: auto; }
        .logo-text { color: #2e7d32; font-weight: bold; font-size: 18px; }

        .header-actions { display: flex; align-items: center; gap: 12px; }
        .theme-toggle { background: #f0f4f1; border: 1px solid #ccc; border-radius: 50px; padding: 8px 14px; font-size: 15px; cursor: pointer; }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; box-shadow: 4px 0 25px rgba(0,0,0,0.15); transition: left 0.3s ease; z-index: 1000; padding: 25px 20px; overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .sidebar-close { background: none; border: none; font-size: 22px; cursor: pointer; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #263528; text-decoration: none; font-size: 15px; font-weight: bold; border-radius: 12px; transition: 0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: #e8f5e9; color: #2e7d32; }

        main { max-width: 700px; margin: auto; padding: 35px 20px; }
        .heading h1 { font-size: 28px; margin-bottom: 6px; color: #2e7d32; }
        body.dark-mode .heading h1 { color: #81c784; }
        .heading p { color: #718071; font-size: 14px; margin-bottom: 25px; }

        .suggest-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 25px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #2e7d32; }
        body.dark-mode .form-group label { color: #81c784; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #ccc; border-radius: 12px; font-size: 14px; outline: none; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        .btn-submit-suggest { width: 100%; background: #2e7d32; color: white; border: none; padding: 14px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit-suggest:hover { background: #236327; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; }
        .overlay.active { display: block; }
    </style>
</head>

<body>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>เมนูหลัก 🌿</h3>
            <button class="sidebar-close" onclick="closeSidebar()">✕</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="./library.html">🌿 คลังธรรมชาติ</a></li>
            <li><a href="./board.html">📌 บอร์ดพูดคุยความรู้สึก</a></li>
            <li><a href="./suggest.html" class="active">🌱 แนะนำให้รู้จัก</a></li>
        </ul>
    </div>

    <header>
        <div class="header-left">
            <button class="hamburger-btn" onclick="openSidebar()">☰</button>
            <a href="./index.html" class="header-logo-link">
                <img src="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy" alt="KU Nature Logo" class="header-logo-img">
                <span class="logo-text">MY KU MY NATURE</span>
            </a>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleDarkMode()">🌙</button>
        </div>
    </header>

    <main>
        <div class="heading">
            <h1>🌱 แนะนำพืชให้รู้จัก</h1>
            <p>พบเจอต้นไม้ใหม่ๆ ในมหาวิทยาลัย? เสนอข้อมูลเข้ามาได้เลยโดยไม่จำเป็นต้องกรอกครบทุกช่อง แอดมินจะตรวจสอบและอนุมัติลงคลังธรรมชาติให้ครับ</p>
        </div>

        <div class="suggest-card">
            <form id="suggestForm" onsubmit="submitPlantSuggestion(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>ไอคอนสัญลักษณ์</label>
                        <input type="text" id="sugIcon" placeholder="เช่น 🌳, 🌸, 🍄">
                    </div>
                    <div class="form-group">
                        <label>ชื่อต้นไม้/พืช</label>
                        <input type="text" id="sugName" placeholder="เช่น ต้นนนทรี, ดอกแก้ว">
                    </div>
                </div>

                <div class="form-group">
                    <label>ชื่อวิทยาศาสตร์</label>
                    <input type="text" id="sugScientific" placeholder="เช่น Peltophorum pterocarpum">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>หมวดหมู่/ประเภท</label>
                        <select id="sugCategory">
                            <option value="ไม้ยืนต้น">ไม้ยืนต้น</option>
                            <option value="ไม้ดอก">ไม้ดอก</option>
                            <option value="เห็ดรา">เห็ดรา</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>วงศ์ (Family)</label>
                        <input type="text" id="sugFamily" placeholder="เช่น Fabaceae">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>อายุเฉลี่ย</label>
                        <input type="text" id="sugAvgAge" placeholder="เช่น 10 - 20 ปี">
                    </div>
                    <div class="form-group">
                        <label>สถานที่พบใน KU</label>
                        <input type="text" id="sugLocation" placeholder="เช่น หน้าอาคารสารสนเทศ">
                    </div>
                </div>

                <div class="form-group">
                    <label>คำอธิบาย/เรื่องราวเพิ่มเติม</label>
                    <textarea id="sugDescription" rows="4" placeholder="เล่ารายละเอียดหรือข้อสังเกตของพืชต้นนี้..."></textarea>
                </div>

                <button type="submit" class="btn-submit-suggest">📩 ส่งข้อมูลเสนอแอดมิน</button>
            </form>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOnvU6c3-EouUDoxzxDSTTEI-siU3d0fo",
            authDomain: "mykumynature.firebaseapp.com",
            databaseURL: "https://mykumynature-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "mykumynature",
            storageBucket: "mykumynature.firebasestorage.app",
            messagingSenderId: "871727030249",
            appId: "1:871727030249:web:c0ffea6461c0503765f578",
            measurementId: "G-BE88SS6HLJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = JSON.parse(localStorage.getItem("ku_user") || "null");

        function submitPlantSuggestion(e) {
            e.preventDefault();

            if (!currentUser) {
                alert("🔒 กรุณาเข้าสู่ระบบก่อนทำการแนะนำพืชครับ");
                return;
            }

            const sugRef = db.ref('pending_plants').push();
            sugRef.set({
                id: sugRef.key,
                userId: currentUser.username,
                userName: currentUser.fullName,
                userAvatar: currentUser.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser.username}`,
                icon: document.getElementById("sugIcon").value.trim() || "🌿",
                name: document.getElementById("sugName").value.trim() || "ยังไม่ระบุชื่อพืช",
                scientific: document.getElementById("sugScientific").value.trim() || "-",
                category: document.getElementById("sugCategory").value || "ไม้ยืนต้น",
                type: document.getElementById("sugCategory").value || "ไม้ยืนต้น",
                family: document.getElementById("sugFamily").value.trim() || "-",
                avgAge: document.getElementById("sugAvgAge").value.trim() || "-",
                location: document.getElementById("sugLocation").value.trim() || "ภายใน มก.ฉกส.",
                description: document.getElementById("sugDescription").value.trim() || "ไม่มีข้อมูลรายละเอียดเพิ่มเติม",
                createdAt: new Date().toISOString()
            }).then(() => {
                document.getElementById("suggestForm").reset();
                alert("🎉 ส่งข้อมูลพืชให้แอดมินเรียบร้อยแล้ว! แอดมินจะทำการตรวจสอบข้อมูลครับ");
            }).catch(err => alert("❌ เกิดข้อผิดพลาด: " + err.message));
        }

        function openSidebar() { document.getElementById("sidebar").classList.add("open"); document.getElementById("overlay").classList.add("active"); }
        function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("overlay").classList.remove("active"); }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            document.getElementById("themeToggleBtn").innerHTML = isDark ? "☀️" : "🌙";
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }

        (function checkSavedTheme() {
            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark-mode");
                const btn = document.getElementById("themeToggleBtn");
                if (btn) btn.innerHTML = "☀️";
            }
        })();
    </script>
</body>
</html>
