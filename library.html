<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Board - My KU My Nature</title>

    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy">

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f8f4; color: #263528; padding-bottom: 50px; transition: background 0.3s, color 0.3s; }
        body.dark-mode { background: #121813; color: #e0e6e1; }
        body.dark-mode header, body.dark-mode .sidebar { background: #1e2620; border-color: #2e3b30; }
        body.dark-mode .sidebar a { color: #e0e6e1; }
        body.dark-mode .sidebar a:hover, body.dark-mode .sidebar a.active { background: #2a352c; color: #81c784; }
        body.dark-mode .logo-text { color: #81c784 !important; }
        body.dark-mode .admin-modal-content { background: #1e2620; color: #e0e6e1; }
        body.dark-mode .form-group input, body.dark-mode .form-group textarea, body.dark-mode .form-group select { background: #2a352c; border-color: #3e4e40; color: #fff; }

        header { background: white; padding: 14px 5%; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .hamburger-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: inherit; padding: 5px; border-radius: 6px; }
        .header-logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .header-logo-img { height: 38px; width: auto; object-fit: contain; }
        .logo-text { color: #2e7d32; font-weight: bold; font-size: 18px; letter-spacing: 1px; }

        .header-actions { display: flex; align-items: center; gap: 12px; }
        .theme-toggle { background: #f0f4f1; border: 1px solid #ccc; border-radius: 50px; padding: 8px 14px; font-size: 15px; cursor: pointer; }

        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; box-shadow: 4px 0 25px rgba(0,0,0,0.15); transition: left 0.3s ease; z-index: 1000; padding: 25px 20px; overflow-y: auto; }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .sidebar-close { background: none; border: none; font-size: 22px; cursor: pointer; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 10px; }
        .sidebar-menu a { display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: #263528; text-decoration: none; font-size: 15px; font-weight: bold; border-radius: 12px; transition: 0.2s; }
        .sidebar-menu a:hover, .sidebar-menu a.active { background: #e8f5e9; color: #2e7d32; }
        .menu-divider { height: 1px; background: #eee; margin: 15px 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; backdrop-filter: blur(2px); }
        .overlay.active { display: block; }

        /* User Profile Box */
        .user-profile-box { background: #e8f5e9; padding: 16px; border-radius: 16px; margin-bottom: 15px; text-align: center; }
        body.dark-mode .user-profile-box { background: #2a352c; }
        .user-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin: 0 auto 8px; border: 2px solid #2e7d32; display: block; }
        .user-profile-name { font-weight: bold; color: #2e7d32; font-size: 15px; margin-bottom: 2px; }
        body.dark-mode .user-profile-name { color: #81c784; }
        .user-role-badge { font-size: 11px; color: #666; margin-bottom: 10px; }
        body.dark-mode .user-role-badge { color: #aaa; }
        .btn-logout { background: #d32f2f; color: white; border: none; padding: 5px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; font-weight: bold; }

        main { max-width: 1200px; margin: auto; padding: 35px 25px; }
        .heading h1 { font-size: 32px; margin-bottom: 6px; }
        .heading p { color: #718071; font-size: 15px; }

        /* =========================
           สไตล์บอร์ดกระดาษโน้ต
        ========================= */
        .board-header-action { display: flex; justify-content: space-between; align-items: center; margin: 25px 0; }
        .btn-create-post { background: #2e7d32; color: white; border: none; padding: 12px 24px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.25); transition: 0.2s; }
        .btn-create-post:hover { transform: translateY(-2px); background: #236327; }

        .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin-top: 20px; }
        
        /* การ์ดกระดาษโน้ตวินเทจ */
        .paper-note { background: #fffdf0; border-radius: 4px; padding: 20px 18px; box-shadow: 3px 10px 20px rgba(0,0,0,0.12); position: relative; border: 1px solid #f0e6c2; transform: rotate(-1deg); transition: 0.3s; color: #333; }
        .paper-note:nth-child(even) { transform: rotate(1.5deg); background: #fdfbf7; }
        .paper-note:hover { transform: scale(1.03) rotate(0deg); z-index: 10; box-shadow: 5px 15px 25px rgba(0,0,0,0.18); }
        
        /* สติกเกอร์/เทปแปะมุมกระดาษ */
        .paper-note::before { content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 70px; height: 20px; background: rgba(220, 210, 180, 0.5); border-left: 2px dashed rgba(255,255,255,0.5); border-right: 2px dashed rgba(255,255,255,0.5); backdrop-filter: blur(2px); }
        
        .note-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; border-bottom: 1px dashed #ddd; padding-bottom: 8px; }
        .note-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
        .note-user { font-weight: bold; font-size: 13px; color: #2e7d32; }
        .note-date { font-size: 11px; color: #888; margin-left: auto; }

        /* กรอบโพลารอยด์แปะรูปต้นไม้ */
        .polaroid-frame { background: white; padding: 8px 8px 12px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border: 1px solid #eee; margin-bottom: 12px; text-align: center; }
        .polaroid-img { width: 100%; height: 160px; object-fit: cover; border-radius: 2px; }
        .polaroid-title { font-size: 13px; font-weight: bold; color: #444; margin-top: 6px; }

        .note-text { font-size: 14px; line-height: 1.5; color: #2c3e50; word-break: break-word; }

        /* Modal Popups */
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 2000; justify-content: center; align-items: center; padding: 20px; backdrop-filter: blur(4px); }
        .admin-modal-content { background: white; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #2e7d32; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; outline: none; }

        .btn-submit { width: 100%; background: #2e7d32; color: white; border: none; padding: 12px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-submit:hover { background: #236327; }

        @media (max-width: 600px) {
            .heading h1 { font-size: 24px; }
            .board-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        }
    </style>
</head>

<body>

    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>เมนูหลัก 🌿</h3>
            <button class="sidebar-close" onclick="closeSidebar()">✕</button>
        </div>

        <!-- กล่องโพรไฟล์เมื่อล็อกอิน -->
        <div class="user-profile-box" id="userProfileBox" style="display: none;">
            <img class="user-avatar" id="userAvatarImg" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="Avatar">
            <div class="user-profile-name" id="userProfileName">👤 User Name</div>
            <div class="user-role-badge" id="userRoleBadge">สมาชิกทั่วไป</div>
            <button class="btn-logout" onclick="logoutUser()">ออกจากระบบ</button>
        </div>

        <ul class="sidebar-menu">
            <li><a href="./library.html">🌿 คลังธรรมชาติ</a></li>
            <li><a href="./board.html" class="active">📌 บอร์ดพูดคุยความรู้สึก</a></li>
        </ul>
    </div>

    <header>
        <div class="header-left">
            <button class="hamburger-btn" onclick="openSidebar()">☰</button>
            <a href="./index.html" class="header-logo-link">
                <img src="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy" alt="KU Nature Logo" class="header-logo-img">
                <span class="logo-text">MY KU MY NATURE</span>
            </a>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleDarkMode()">🌙</button>
        </div>
    </header>

    <main>
        <div class="heading">
            <h1>Nature Board 📌</h1>
            <p>แปะการ์ดพืช แชร์ความรู้สึกและความประทับใจที่คุณมีต่อธรรมชาติรอบตัว</p>
        </div>

        <div class="board-header-action">
            <button class="btn-create-post" onclick="openCreatePostModal()">✍️ แปะโน้ตแบ่งปันความรู้สึก</button>
        </div>

        <div class="board-grid" id="boardGrid">
            <!-- การ์ดโน้ตกระดาษจะถูกซิงค์มาวางที่นี่ -->
        </div>
    </main>

    <!-- Modal แปะโน้ตสร้างโพสต์ความรู้สึก -->
    <div class="admin-modal" id="createPostModal">
        <div class="admin-modal-content">
            <div class="modal-header">
                <h2>✍️ แปะโน้ตแบ่งปันความรู้สึก</h2>
                <button class="sidebar-close" onclick="closeCreatePostModal()">✕</button>
            </div>
            <form id="createPostForm" onsubmit="handleSavePost(event)">
                <div class="form-group">
                    <label>เลือกการ์ดต้นไม้/พืชที่ประทับใจ</label>
                    <select id="postPlantSelect" required>
                        <option value="">-- กรุณาเลือกต้นไม้ --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>เขียนความรู้สึกหรือเรื่องราวของคุณ</label>
                    <textarea id="postContent" rows="4" placeholder="เล่าความรู้สึก ความทรงจำ หรือเกร็ดความรู้สั้นๆ..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">📌 แปะลงบนบอร์ดเลย!</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOnvU6c3-EouUDoxzxDSTTEI-siU3d0fo",
            authDomain: "mykumynature.firebaseapp.com",
            databaseURL: "https://mykumynature-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "mykumynature",
            storageBucket: "mykumynature.firebasestorage.app",
            messagingSenderId: "871727030249",
            appId: "1:871727030249:web:c0ffea6461c0503765f578",
            measurementId: "G-BE88SS6HLJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allPlantsData = [];
        let currentUser = null;

        /* =========================
           ระบบโหลดการ์ดพืช + ซิงค์บอร์ด Realtime
        ========================= */
        function loadPlantsList() {
            db.ref('plants').once('value', (snapshot) => {
                const data = snapshot.val();
                allPlantsData = data ? Object.values(data) : [];
            });
        }

        function syncBoardPosts() {
            db.ref('posts').on('value', (snapshot) => {
                const postsData = snapshot.val();
                const grid = document.getElementById("boardGrid");
                grid.innerHTML = "";

                if (!postsData) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:#777; padding:40px;">📌 ยังไม่มีโน้ตความรู้สึก มาเป็นคนแรกที่เขียนโน้ตแบ่งปันกันเถอะ!</div>`;
                    return;
                }

                const posts = Object.values(postsData).reverse();
                posts.forEach(post => {
                    const note = document.createElement("div");
                    note.className = "paper-note";
                    const dateStr = new Date(post.createdAt).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });

                    note.innerHTML = `
                        <div class="note-header">
                            <img class="note-avatar" src="${post.userAvatar}" alt="${post.userName}">
                            <span class="note-user">${post.userName}</span>
                            <span class="note-date">${dateStr}</span>
                        </div>
                        <div class="polaroid-frame">
                            <img class="polaroid-img" src="${post.plantImage}" alt="${post.plantName}">
                            <div class="polaroid-title">${post.plantIcon || ''} ${post.plantName}</div>
                        </div>
                        <div class="note-text">${post.content}</div>
                    `;
                    grid.appendChild(note);
                });
            });
        }

        function openCreatePostModal() {
            if (!currentUser) {
                alert("🔒 กรุณาเข้าสู่ระบบที่หน้า คลังธรรมชาติ (library.html) ก่อนลงโน้ตความรู้สึกครับ");
                return;
            }

            const select = document.getElementById("postPlantSelect");
            select.innerHTML = `<option value="">-- กรุณาเลือกต้นไม้ --</option>`;
            allPlantsData.forEach(plant => {
                select.innerHTML += `<option value="${plant.id}">${plant.icon || '🌿'} ${plant.name}</option>`;
            });

            document.getElementById("createPostModal").style.display = "flex";
        }

        function closeCreatePostModal() {
            document.getElementById("createPostModal").style.display = "none";
        }

        function handleSavePost(e) {
            e.preventDefault();
            if (!currentUser) return;

            const plantId = document.getElementById("postPlantSelect").value;
            const content = document.getElementById("postContent").value.trim();
            const plant = allPlantsData.find(p => p.id === plantId);

            if (!plant) {
                alert("⚠️ ไม่พบข้อมูลการ์ดต้นไม้ที่เลือก");
                return;
            }

            const newPostRef = db.ref('posts').push();
            newPostRef.set({
                id: newPostRef.key,
                userId: currentUser.username,
                userName: currentUser.fullName,
                userAvatar: currentUser.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser.username}`,
                plantId: plant.id,
                plantName: plant.name,
                plantImage: plant.image,
                plantIcon: plant.icon || '🌿',
                content: content,
                createdAt: new Date().toISOString()
            }).then(() => {
                closeCreatePostModal();
                document.getElementById("createPostForm").reset();
                alert("🎉 แปะโน้ตความรู้สึกเรียบร้อยแล้ว!");
            });
        }

        function checkUserSession() {
            const savedUser = localStorage.getItem("ku_user");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                const profileBox = document.getElementById("userProfileBox");
                document.getElementById("userProfileName").innerText = currentUser.fullName;
                document.getElementById("userAvatarImg").src = currentUser.avatar || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser.username}`;
                document.getElementById("userRoleBadge").innerText = currentUser.role === 'admin' ? "🔑 ผู้ดูแลระบบ" : "👤 สมาชิกทั่วไป";
                profileBox.style.display = "block";
            }
        }

        function logoutUser() {
            currentUser = null;
            localStorage.removeItem("ku_user");
            location.reload();
        }

        function openSidebar() { document.getElementById("sidebar").classList.add("open"); document.getElementById("overlay").classList.add("active"); }
        function closeSidebar() { document.getElementById("sidebar").classList.remove("open"); document.getElementById("overlay").classList.remove("active"); }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            document.getElementById("themeToggleBtn").innerHTML = isDark ? "☀️" : "🌙";
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }

        (function checkSavedTheme() {
            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark-mode");
                const btn = document.getElementById("themeToggleBtn");
                if (btn) btn.innerHTML = "☀️";
            }
        })();

        checkUserSession();
        loadPlantsList();
        syncBoardPosts();
    </script>
</body>
</html>
