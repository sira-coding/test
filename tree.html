<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายละเอียดธรรมชาติ - My KU My Nature</title>

    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f8f4; color: #263528; padding-bottom: 50px; transition: background 0.3s, color 0.3s; }
        body.dark-mode { background: #121813; color: #e0e6e1; }
        body.dark-mode .top-bar { background: #1e2620; border-bottom-color: #2e3b30; }
        body.dark-mode .back-btn { color: #81c784; }
        body.dark-mode .logo-text { color: #81c784 !important; }
        body.dark-mode .detail-card { background: #1e2620; box-shadow: 0 5px 25px rgba(0,0,0,0.4); }
        body.dark-mode .left-column { background: #18201a; border-right-color: #2e3b30; }
        body.dark-mode .tree-title { color: #ffffff; }
        body.dark-mode .scientific-name { color: #a0b2a2; }
        body.dark-mode .info-grid { background: #18201a; }
        body.dark-mode .info-value { color: #ffffff; }
        body.dark-mode .info-label { color: #a0b2a2; }
        body.dark-mode .description { color: #c8d6c9; }
        body.dark-mode .theme-toggle { background: #2a352c; color: #ffeb3b; border-color: #3e4e40; }

        .top-bar { background: white; padding: 14px 6%; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; transition: background 0.3s; }
        .top-bar-left { display: flex; align-items: center; gap: 18px; }
        .back-btn { background: none; border: none; font-size: 15px; color: #2e7d32; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .header-logo-link { display: flex; align-items: center; gap: 10px; text-decoration: none; border-left: 1px solid #ddd; padding-left: 18px; }
        body.dark-mode .header-logo-link { border-left-color: #3e4e40; }
        .header-logo-img { height: 34px; width: auto; object-fit: contain; }
        .logo-text { color: #2e7d32; font-weight: bold; font-size: 16px; letter-spacing: 1px; }

        .theme-toggle { background: #f0f4f1; border: 1px solid #ccc; border-radius: 50px; padding: 8px 16px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .detail-card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 5px 25px rgba(0,0,0,0.08); display: flex; flex-wrap: wrap; transition: background 0.3s; }

        .left-column { flex: 1; min-width: 320px; background: #fafafa; padding: 25px; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #eee; }
        .viewer-box { width: 100%; height: 380px; border-radius: 15px; overflow: hidden; }
        .main-img { width: 100%; height: 100%; object-fit: cover; }

        .btn-open-360 { margin-top: 15px; width: 100%; background: #2e7d32; color: white; border: none; padding: 12px 20px; border-radius: 30px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.25); }
        .btn-open-360:hover { background: #236327; transform: translateY(-2px); }

        .right-column { flex: 1.2; min-width: 320px; padding: 35px; }
        .badge-type { display: inline-block; padding: 6px 14px; background: #e8f5e9; color: #2e7d32; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 12px; }
        body.dark-mode .badge-type { background: #2a3d2c; color: #81c784; }

        .tree-title { font-size: 32px; margin-bottom: 6px; }
        .scientific-name { font-size: 18px; color: #718071; font-style: italic; margin-bottom: 24px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; background: #f9fbf9; padding: 20px; border-radius: 12px; }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 13px; color: #718071; margin-bottom: 4px; }
        .info-value { font-size: 16px; font-weight: bold; color: #263528; }
        .section-title { font-size: 18px; font-weight: bold; color: #2e7d32; margin-bottom: 8px; border-bottom: 2px solid #e8f5e9; padding-bottom: 4px; }
        body.dark-mode .section-title { color: #81c784; border-bottom-color: #2e3b30; }
        .description { font-size: 15px; line-height: 1.6; color: #4a5a4c; }

        .modal-360 { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 999; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { position: relative; width: 90%; max-width: 900px; height: 80vh; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .close-btn { position: absolute; top: 15px; right: 20px; background: rgba(0, 0, 0, 0.6); color: white; border: none; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 1001; display: flex; align-items: center; justify-content: center; }
        #panorama { width: 100%; height: 100%; }

        @media (max-width: 768px) {
            .detail-card { flex-direction: column; }
            .left-column { border-right: none; border-bottom: 1px solid #eee; }
            .info-grid { grid-template-columns: 1fr; }
            .right-column { padding: 20px; }
            .tree-title { font-size: 26px; }
            .modal-content { height: 70vh; }
            .logo-text { font-size: 13px; }
            .header-logo-img { height: 28px; }
            .top-bar-left { gap: 10px; }
            .header-logo-link { padding-left: 10px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="./library.html" class="back-btn">⬅ ย้อนกลับ</a>
            <a href="./library.html" class="header-logo-link">
                <img src="https://lh3.googleusercontent.com/d/1KBBm8ycOHwkVl7OAXx009_AhLFFK5Fzy" alt="KU Nature Logo" class="header-logo-img">
                <span class="logo-text">MY KU MY NATURE</span>
            </a>
        </div>
        <button class="theme-toggle" id="themeToggleBtn" onclick="toggleDarkMode()">🌙</button>
    </div>

    <div class="container">
        <div class="detail-card" id="detailCard"></div>
    </div>

    <div class="modal-360" id="modal360">
        <div class="modal-content">
            <button class="close-btn" onclick="close360Viewer()">✕</button>
            <div id="panorama"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDOnvU6c3-EouUDoxzxDSTTEI-siU3d0fo",
            authDomain: "mykumynature.firebaseapp.com",
            databaseURL: "https://mykumynature-default-rtdb.firebaseio.com",
            projectId: "mykumynature",
            storageBucket: "mykumynature.firebasestorage.app",
            messagingSenderId: "871727030249",
            appId: "1:871727030249:web:c0ffea6461c0503765f578",
            measurementId: "G-BE88SS6HLJ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let pannellumViewer = null;

        function getPlantIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        function open360Viewer(panoUrl) {
            document.getElementById("modal360").style.display = "flex";
            if (pannellumViewer) pannellumViewer.destroy();
            
            pannellumViewer = pannellum.viewer('panorama', {
                "type": "equirectangular",
                "panorama": panoUrl,
                "autoLoad": true,
                "compass": false,
                "haov": 200,
                "vaov": 70,
                "vOffset": 0,
                "hfov": 90,
                "minHfov": 50,
                "maxHfov": 110,
                "minPitch": -25,
                "maxPitch": 25,
                "minYaw": -90,
                "maxYaw": 90
            });
        }

        function close360Viewer() {
            document.getElementById("modal360").style.display = "none";
        }

        function renderPlantDetail() {
            const id = getPlantIdFromURL();
            const cardContainer = document.getElementById('detailCard');

            db.ref('plants/' + id).once('value', (snapshot) => {
                const plant = snapshot.val();

                if (plant) {
                    cardContainer.innerHTML = `
                        <div class="left-column">
                            <div class="viewer-box">
                                <img class="main-img" src="${plant.image}" alt="${plant.name}">
                            </div>
                            <button class="btn-open-360" onclick="open360Viewer('${plant.panoramaImage}')">
                                🌐 เปิดมุมมอง 180° (เลื่อนดูอิสระ)
                            </button>
                        </div>

                        <div class="right-column">
                            <span class="badge-type">${plant.type || plant.category}</span>
                            <h1 class="tree-title">${plant.name}</h1>
                            <div class="scientific-name">${plant.scientific}</div>

                            <div class="info-grid">
                                <div class="info-item">
                                    <span class="info-label">🧬 สายพันธุ์ / วงศ์</span>
                                    <span class="info-value">${plant.family}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">⏳ อายุเฉลี่ย</span>
                                    <span class="info-value">${plant.avgAge}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">📍 จุดที่ค้นพบ</span>
                                    <span class="info-value">${plant.location}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">🌐 พิกัด (Lat, Long)</span>
                                    <span class="info-value">${plant.coordinates}</span>
                                </div>
                            </div>

                            <div class="section-title">รายละเอียดเพิ่มเติม</div>
                            <p class="description">${plant.description}</p>
                        </div>
                    `;
                    document.title = `${plant.name} - My KU My Nature`;
                } else {
                    cardContainer.innerHTML = `
                        <div style="text-align:center; padding:60px 20px; width:100%;">
                            <h2>⚠️ ไม่พบข้อมูลพืชชนิดนี้</h2>
                            <p>กรุณากลับไปเลือกพืชใหม่อีกครั้งที่หน้าคลังธรรมชาติครับ</p>
                        </div>
                    `;
                }
            });
        }

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
            const isDark = document.body.classList.contains("dark-mode");
            document.getElementById("themeToggleBtn").innerHTML = isDark ? "☀️" : "🌙";
            localStorage.setItem("theme", isDark ? "dark" : "light");
        }

        (function checkSavedTheme() {
            if (localStorage.getItem("theme") === "dark") {
                document.body.classList.add("dark-mode");
                const btn = document.getElementById("themeToggleBtn");
                if (btn) btn.innerHTML = "☀️";
            }
        })();

        renderPlantDetail();
    </script>
</body>
</html>
